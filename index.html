<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remo & Marisa - Family Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-attachment: fixed;
        }
        
        .glass-card { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }

        /* Daily Quote Special Styling */
        .quote-card {
            background: linear-gradient(120deg, rgba(255,255,255,0.9) 0%, rgba(255,240,245,0.8) 100%);
            border-left: 4px solid #f472b6;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }

        .list-item-enter { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .puff-out {
            opacity: 0;
            transform: scale(0.8) translateY(-20px) rotate(2deg);
            filter: blur(4px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0.2, 1);
        }
        
        .input-glow:focus-within {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 text-gray-800">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header & Memories -->
        <header class="glass-card rounded-[2rem] p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-400 via-pink-400 to-emerald-400"></div>
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 mb-3 mt-2">Remo & Marisa</h1>
            <p class="text-gray-500 font-medium mb-6">Gemeinsame Organisation schafft Freiraum für die wichtigen Dinge.</p>
            <div class="flex flex-wrap justify-center gap-3 text-sm font-medium">
                <span class="bg-white/80 text-blue-700 px-5 py-2.5 rounded-2xl shadow-sm border border-white"><i class="fas fa-ring mr-2 opacity-70"></i>31.05.2019</span>
                <span class="bg-white/80 text-pink-700 px-5 py-2.5 rounded-2xl shadow-sm border border-white"><i class="fas fa-star mr-2 opacity-70"></i>Stella 27.10.2018</span>
                <span class="bg-white/80 text-teal-700 px-5 py-2.5 rounded-2xl shadow-sm border border-white"><i class="fas fa-plane mr-2 opacity-70"></i>Sardinien & Toscana</span>
            </div>
        </header>

        <!-- Spruch des Tages (Marisa Appreciation) -->
        <section class="glass-card quote-card rounded-[2rem] p-6 md:p-8 shadow-sm relative overflow-hidden">
            <div class="absolute right-0 top-0 w-32 h-32 bg-pink-100 rounded-full blur-3xl opacity-50 -z-10 -translate-y-1/2 translate-x-1/2"></div>
            <div class="flex items-center mb-2">
                <i class="fas fa-quote-left text-pink-400 text-xl mr-3"></i>
                <h2 class="text-lg font-bold text-gray-800 tracking-wide uppercase text-xs text-pink-500">Botschaft des Tages für Marisa</h2>
            </div>
            <p id="dailyQuoteText" class="text-xl md:text-2xl font-medium text-gray-700 leading-relaxed italic"></p>
        </section>

        <!-- 2x2 Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Aufgaben -->
            <section class="glass-card rounded-[2rem] p-6 md:p-8 flex flex-col h-[450px]">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center mr-4 shadow-sm">
                        <i class="fas fa-check"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">To-Do</h2>
                </div>
                <div class="flex mb-6 bg-white rounded-2xl p-1.5 shadow-sm border border-gray-100 input-glow transition-all">
                    <input type="text" id="taskInput" placeholder="Was steht an?" class="flex-1 bg-transparent px-4 py-2 focus:outline-none text-gray-700">
                    <button onclick="addItem('tasks', 'taskInput')" class="bg-indigo-600 text-white px-5 py-2 rounded-xl hover:bg-indigo-700 transition-colors shadow-sm font-medium"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="tasksList" class="flex-1 overflow-y-auto space-y-3 pr-2"></ul>
            </section>

            <!-- Einkaufsliste -->
            <section class="glass-card rounded-[2rem] p-6 md:p-8 flex flex-col h-[450px]">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center mr-4 shadow-sm">
                        <i class="fas fa-shopping-basket"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">Einkauf</h2>
                </div>
                <div class="flex mb-6 bg-white rounded-2xl p-1.5 shadow-sm border border-gray-100 focus-within:ring-2 focus-within:ring-emerald-100 transition-all">
                    <input type="text" id="shopInput" placeholder="Was fehlt im Kühlschrank?" class="flex-1 bg-transparent px-4 py-2 focus:outline-none text-gray-700">
                    <button onclick="addItem('shopping', 'shopInput')" class="bg-emerald-500 text-white px-5 py-2 rounded-xl hover:bg-emerald-600 transition-colors shadow-sm font-medium"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="shoppingList" class="flex-1 overflow-y-auto space-y-3 pr-2"></ul>
            </section>

            <!-- Ämtli Plan -->
            <section class="glass-card rounded-[2rem] p-6 md:p-8 flex flex-col h-[450px]">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center mr-4 shadow-sm">
                        <i class="fas fa-broom"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">Ämtli-Plan</h2>
                </div>
                <div class="space-y-3 mb-6">
                    <div class="bg-white rounded-2xl p-1.5 shadow-sm border border-gray-100 flex transition-all">
                        <input type="text" id="choreInput" placeholder="Welches Ämtli?" class="w-full bg-transparent px-4 py-2 focus:outline-none text-gray-700">
                    </div>
                    <div class="flex gap-3">
                        <select id="chorePerson" class="flex-1 bg-white border border-gray-100 rounded-2xl px-4 py-3 shadow-sm focus:outline-none text-gray-700 font-medium">
                            <option value="Remo">Zuweisen an: Remo</option>
                            <option value="Marisa">Zuweisen an: Marisa</option>
                        </select>
                        <button onclick="addChore()" class="bg-orange-500 text-white px-6 py-3 rounded-2xl hover:bg-orange-600 transition-colors shadow-sm font-medium">Speichern</button>
                    </div>
                </div>
                <ul id="choresList" class="flex-1 overflow-y-auto space-y-3 pr-2"></ul>
            </section>

            <!-- Flüsterpost -->
            <section class="glass-card rounded-[2rem] p-6 md:p-8 flex flex-col h-[450px] relative overflow-hidden">
                <div class="absolute -right-10 -top-10 text-pink-500/10 text-9xl"><i class="fas fa-heart"></i></div>
                <div class="flex items-center mb-2 relative z-10">
                    <div class="w-10 h-10 rounded-xl bg-pink-100 text-pink-600 flex items-center justify-center mr-4 shadow-sm">
                        <i class="fas fa-comment-dots"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-800">Flüsterpost</h2>
                </div>
                <p class="text-sm text-gray-500 mb-6 relative z-10 font-medium">Liest sich nach einmaligem Antippen und verpufft.</p>
                <div class="flex mb-6 bg-white rounded-2xl p-1.5 shadow-sm border border-gray-100 focus-within:ring-2 focus-within:ring-pink-100 transition-all relative z-10">
                    <input type="text" id="msgInput" placeholder="Geheime Nachricht schreiben..." class="flex-1 bg-transparent px-4 py-2 focus:outline-none text-gray-700">
                    <button onclick="addItem('secret_messages', 'msgInput')" class="bg-pink-500 text-white px-5 py-2 rounded-xl hover:bg-pink-600 transition-colors shadow-sm font-medium"><i class="fas fa-paper-plane"></i></button>
                </div>
                <ul id="messagesList" class="flex-1 overflow-y-auto space-y-3 pr-2 relative z-10"></ul>
            </section>

        </div>
    </div>

    <!-- Tägliche Zitate Logik -->
    <script>
        const marisaQuotes = [
            "Marisa, danke, dass du jeden Tag besonders machst – egal ob beim Sonnenuntergang auf Sardinien oder im Alltag Zuhause in Altdorf.",
            "Für die beste Ehefrau und Mami: Dein Lächeln, wie damals in der Toscana oder in Griechenland, ist mein grösster Antrieb.",
            "Egal ob wir durch Lucca rennen, in Caslano spazieren oder den Alltag wuppen – mit dir an meiner Seite ist alles ein Abenteuer.",
            "Du bist mein Fels in der Brandung. Vom Perdepera Resort bis zum Bürglen-Ausflug – die schönsten Erinnerungen gehören uns.",
            "Eine starke Frau, eine wunderbare Mutter für Stella. Danke, dass du unser Familienleben so grossartig meisterst. Du bist unbezahlbar.",
            "Egal wie stressig mein Tag im SVZ ist – der Gedanke an unsere Familienferien am Gardasee und dein Lächeln gibt mir Kraft.",
            "Unsere gemeinsamen Jahre seit dem 31.05.2019 sind mein grösster Schatz. Ich bin unendlich stolz, dich an meiner Seite zu haben.",
            "Die kleinen Momente mit dir, sei es in Isenthal oder gemütlich auf dem Sofa, bedeuten mir mehr als alles andere auf der Welt."
        ];

        function displayDailyQuote() {
            // Berechnet die Tage seit dem 1. Jan 1970 und teilt sie durch die Anzahl der Sprüche
            const today = Math.floor(Date.now() / (1000 * 60 * 60 * 24));
            const quoteIndex = today % marisaQuotes.length;
            document.getElementById('dailyQuoteText').innerText = "«" + marisaQuotes[quoteIndex] + "»";
        }
        
        displayDailyQuote();
    </script>

    <!-- Firebase Realtime Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcympyQoY6K72wI-jhubAef34JbS8J-QA",
            authDomain: "lovelife-9f019.firebaseapp.com",
            projectId: "lovelife-9f019",
            storageBucket: "lovelife-9f019.firebasestorage.app",
            messagingSenderId: "69566619232",
            appId: "1:69566619232:web:c30c1e30efc35aeb07ed05"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addItem = async (collectionName, inputId) => {
            const input = document.getElementById(inputId);
            const val = input.value.trim();
            if (val) {
                await addDoc(collection(db, collectionName), {
                    text: val,
                    done: false,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            }
        };

        window.addChore = async () => {
            const input = document.getElementById('choreInput');
            const select = document.getElementById('chorePerson');
            const val = input.value.trim();
            const person = select.value;

            if (val) {
                await addDoc(collection(db, 'chores'), {
                    text: val,
                    person: person,
                    done: false,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            }
        };

        window.toggleDone = async (collectionName, id, currentStatus) => {
            const docRef = doc(db, collectionName, id);
            await updateDoc(docRef, { done: !currentStatus });
        };

        window.deleteItem = async (collectionName, id) => {
            try {
                await deleteDoc(doc(db, collectionName, id));
            } catch (e) {
                console.error("Fehler beim Löschen: ", e);
            }
        };

        window.revealAndDestroy = (id, text) => {
            const el = document.getElementById(`msg-${id}`);
            if(!el) return;
            
            el.onclick = null; 
            
            el.innerHTML = `<div class="font-bold text-xl p-3 text-pink-700 tracking-wide">${text}</div>`;
            el.classList.replace('bg-white', 'bg-pink-50');
            el.classList.replace('border-gray-100', 'border-pink-200');
            
            setTimeout(() => {
                el.classList.add('puff-out');
            }, 4000);
            
            setTimeout(() => {
                deleteItem('secret_messages', id);
            }, 4800);
        };

        function setupListener(collectionName, elementId, isChore = false) {
            const q = query(collection(db, collectionName), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                const ul = document.getElementById(elementId);
                ul.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const id = docSnap.id;
                    
                    const li = document.createElement('li');
                    li.className = `list-item-enter flex justify-between items-center p-4 rounded-2xl border ${item.done ? 'bg-gray-50/50 border-transparent text-gray-400' : 'bg-white border-gray-100 text-gray-700 shadow-sm hover:shadow-md'} transition-all duration-300`;
                    
                    let contentHTML = `<span class="flex-1 cursor-pointer text-lg ${item.done ? 'line-through decoration-gray-300' : 'font-medium'}" onclick="toggleDone('${collectionName}', '${id}', ${item.done})">${item.text}</span>`;
                    
                    if (isChore) {
                        contentHTML = `<div class="flex-1 cursor-pointer" onclick="toggleDone('${collectionName}', '${id}', ${item.done})">
                                          <span class="block text-lg ${item.done ? 'line-through decoration-gray-300' : 'font-medium'}">${item.text}</span>
                                          <span class="text-xs uppercase tracking-wider font-bold mt-1 ${item.done ? 'text-gray-400' : (item.person === 'Remo' ? 'text-indigo-500' : 'text-pink-500')}">Zuständig: ${item.person}</span>
                                       </div>`;
                    }

                    li.innerHTML = `
                        <div class="flex items-center flex-1">
                            <button onclick="toggleDone('${collectionName}', '${id}', ${item.done})" class="mr-4 w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${item.done ? 'border-indigo-500 bg-indigo-500 text-white' : 'border-gray-300 text-transparent hover:border-indigo-400'}">
                                <i class="fas fa-check text-xs"></i>
                            </button>
                            ${contentHTML}
                        </div>
                        <button onclick="deleteItem('${collectionName}', '${id}')" class="text-gray-300 hover:text-red-500 p-2 rounded-xl hover:bg-red-50 transition-colors ml-2"><i class="fas fa-trash-alt"></i></button>
                    `;
                    ul.appendChild(li);
                });
            });
        }

        function setupMessageListener() {
            const q = query(collection(db, 'secret_messages'), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                const ul = document.getElementById('messagesList');
                ul.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const id = docSnap.id;
                    const safeText = item.text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    const li = document.createElement('li');
                    li.id = `msg-${id}`;
                    li.className = `list-item-enter p-5 bg-white border border-gray-100 rounded-2xl cursor-pointer text-center text-pink-400 shadow-sm hover:shadow-md hover:border-pink-200 transition-all duration-300`;
                    li.innerHTML = `
                        <div onclick="revealAndDestroy('${id}', '${safeText}')" class="flex flex-col items-center justify-center">
                            <div class="w-12 h-12 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center mb-2">
                                <i class="fas fa-envelope text-xl"></i>
                            </div>
                            <div class="text-sm font-bold text-gray-700">Neue Nachricht</div>
                            <div class="text-xs text-gray-400 mt-1">Tippen zum Öffnen</div>
                        </div>
                    `;
                    ul.appendChild(li);
                });
            });
        }

        setupListener('tasks', 'tasksList');
        setupListener('shopping', 'shoppingList');
        setupListener('chores', 'choresList', true);
        setupMessageListener();

    </script>
</body>
</html>
