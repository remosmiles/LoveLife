<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remo & Marisa - Family Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- Header & Memories -->
        <header class="glass-panel rounded-2xl shadow-sm p-6 text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Familien-Dashboard</h1>
            <p class="text-gray-500 mb-4">Gemeinsame Organisation schafft Freiraum für die wichtigen Dinge.</p>
            <div class="flex flex-wrap justify-center gap-4 text-sm">
                <span class="bg-blue-50 text-blue-700 px-4 py-2 rounded-full shadow-sm"><i class="fas fa-ring mr-2"></i>Hochzeitstag: 31.05.2019</span>
                <span class="bg-pink-50 text-pink-700 px-4 py-2 rounded-full shadow-sm"><i class="fas fa-star mr-2"></i>Stellas Geburt: 27.10.2018</span>
                <span class="bg-green-50 text-green-700 px-4 py-2 rounded-full shadow-sm"><i class="fas fa-plane mr-2"></i>Sardinien & Toscana Memories</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Aufgaben -->
            <section class="glass-panel rounded-2xl shadow-sm p-6 flex flex-col h-[500px]">
                <h2 class="text-xl font-semibold text-gray-800 mb-4"><i class="fas fa-check-circle text-indigo-500 mr-2"></i>To-Do</h2>
                <div class="flex mb-4">
                    <input type="text" id="taskInput" placeholder="Neue Aufgabe..." class="flex-1 border-gray-300 rounded-l-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 border">
                    <button onclick="addItem('tasks', 'taskInput')" class="bg-indigo-500 text-white px-4 py-2 rounded-r-lg hover:bg-indigo-600"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="tasksList" class="flex-1 overflow-y-auto space-y-2"></ul>
            </section>

            <!-- Einkaufsliste -->
            <section class="glass-panel rounded-2xl shadow-sm p-6 flex flex-col h-[500px]">
                <h2 class="text-xl font-semibold text-gray-800 mb-4"><i class="fas fa-shopping-cart text-emerald-500 mr-2"></i>Einkauf</h2>
                <div class="flex mb-4">
                    <input type="text" id="shopInput" placeholder="Was fehlt? (z.B. Thunfisch, Whey...)" class="flex-1 border-gray-300 rounded-l-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 border">
                    <button onclick="addItem('shopping', 'shopInput')" class="bg-emerald-500 text-white px-4 py-2 rounded-r-lg hover:bg-emerald-600"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="shoppingList" class="flex-1 overflow-y-auto space-y-2"></ul>
            </section>

            <!-- Ämtli Plan -->
            <section class="glass-panel rounded-2xl shadow-sm p-6 flex flex-col h-[500px]">
                <h2 class="text-xl font-semibold text-gray-800 mb-4"><i class="fas fa-broom text-orange-500 mr-2"></i>Ämtli-Plan</h2>
                <div class="space-y-2 mb-4">
                    <input type="text" id="choreInput" placeholder="Welches Ämtli?" class="w-full border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500 border">
                    <div class="flex gap-2">
                        <select id="chorePerson" class="flex-1 border-gray-300 rounded-lg px-3 py-2 border">
                            <option value="Remo">Remo</option>
                            <option value="Marisa">Marisa</option>
                        </select>
                        <button onclick="addChore()" class="bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600"><i class="fas fa-plus mr-1"></i> Hinzufügen</button>
                    </div>
                </div>
                <ul id="choresList" class="flex-1 overflow-y-auto space-y-2"></ul>
            </section>
        </div>
    </div>

    <!-- Firebase Realtime Logic -->
    <script type="module">
        // 1. Importiere Firebase Module
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 2. DEINE FIREBASE KONFIGURATION (Hier musst du deine Daten von der Firebase Webseite eintragen!)
        const firebaseConfig = {
            apiKey: "DEIN_API_KEY_HIER_EINSETZEN",
            authDomain: "DEINE_PROJECT_ID.firebaseapp.com",
            projectId: "DEINE_PROJECT_ID",
            storageBucket: "DEINE_PROJECT_ID.appspot.com",
            messagingSenderId: "DEINE_SENDER_ID",
            appId: "DEINE_APP_ID"
        };

        // 3. Initialisiere Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Globale Funktionen für das HTML zugänglich machen
        window.addItem = async (collectionName, inputId) => {
            const input = document.getElementById(inputId);
            const val = input.value.trim();
            if (val) {
                await addDoc(collection(db, collectionName), {
                    text: val,
                    done: false,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            }
        };

        window.addChore = async () => {
            const input = document.getElementById('choreInput');
            const select = document.getElementById('chorePerson');
            const val = input.value.trim();
            const person = select.value;

            if (val) {
                await addDoc(collection(db, 'chores'), {
                    text: val,
                    person: person,
                    done: false,
                    createdAt: serverTimestamp()
                });
                input.value = '';
            }
        };

        window.toggleDone = async (collectionName, id, currentStatus) => {
            const docRef = doc(db, collectionName, id);
            await updateDoc(docRef, { done: !currentStatus });
        };

        window.deleteItem = async (collectionName, id) => {
            await deleteDoc(doc(db, collectionName, id));
        };

        // Echtzeit-Listener (Listen live aktualisieren, wenn sich Daten in der Cloud ändern)
        function setupListener(collectionName, elementId, isChore = false) {
            const q = query(collection(db, collectionName), orderBy("createdAt", "asc"));
            
            onSnapshot(q, (snapshot) => {
                const ul = document.getElementById(elementId);
                ul.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const id = docSnap.id;
                    
                    const li = document.createElement('li');
                    li.className = `flex justify-between items-center p-3 rounded-lg border ${item.done ? 'bg-gray-50 border-gray-100 text-gray-400 line-through' : 'bg-white border-gray-100 text-gray-700 shadow-sm'} transition-all duration-300`;
                    
                    let contentHTML = `<span class="flex-1 cursor-pointer" onclick="toggleDone('${collectionName}', '${id}', ${item.done})">${item.text}</span>`;
                    
                    if (isChore) {
                        contentHTML = `<div class="flex-1 cursor-pointer" onclick="toggleDone('${collectionName}', '${id}', ${item.done})">
                                          <span class="block">${item.text}</span>
                                          <span class="text-xs ${item.person === 'Remo' ? 'text-blue-500' : 'text-pink-500'} font-medium">Zuständig: ${item.person}</span>
                                       </div>`;
                    }

                    li.innerHTML = `
                        <div class="flex items-center flex-1">
                            <button onclick="toggleDone('${collectionName}', '${id}', ${item.done})" class="mr-3 text-gray-400 hover:text-indigo-500 transition-colors">
                                <i class="far ${item.done ? 'fa-check-circle text-indigo-500' : 'fa-circle'}"></i>
                            </button>
                            ${contentHTML}
                        </div>
                        <button onclick="deleteItem('${collectionName}', '${id}')" class="text-red-300 hover:text-red-500 p-1 transition-colors"><i class="fas fa-trash-alt"></i></button>
                    `;
                    ul.appendChild(li);
                });
            });
        }

        // Starte die Live-Verbindung
        setupListener('tasks', 'tasksList');
        setupListener('shopping', 'shoppingList');
        setupListener('chores', 'choresList', true);

    </script>
</body>
</html>
